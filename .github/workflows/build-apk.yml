name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare 604-page Quran and Tajweed data
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch main https://github.com/ouryhamdalaye/madinah-mushaf-json.git /tmp/madinah-layout
          git -C /tmp/madinah-layout checkout 507eada48f3ffe26a600acf5792a18ba86d6851e
          git -C /tmp/madinah-layout sparse-checkout set pages
          git clone --depth 1 --filter=blob:none --sparse --branch main https://github.com/TheAbubakrAbu/Quran-Tajweed-Engine.git /tmp/quran-tajweed
          git -C /tmp/quran-tajweed checkout edd7afc0551d4bbbb14416a661534f595c97bb67
          git -C /tmp/quran-tajweed sparse-checkout set --skip-checks data/quran.json data/tajweed data/tajweed-rules.json
          python3 scripts/prepare_quran.py --layout /tmp/madinah-layout/pages --engine-data /tmp/quran-tajweed/data
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sana-alayat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
